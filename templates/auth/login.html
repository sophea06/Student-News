<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student News System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="icon" href="/static/images/logo.png" type="image/png">

    <style>
        /* Fade-in card animation */
        .auth-card {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.5s ease-in-out;
        }

        .auth-card.show {
            opacity: 1;
            transform: translateY(0);
        }

        .auth-bg {
            background: linear-gradient(to right, #4e73df, #1cc88a);
        }

        .input-group-text {
            background-color: #f8f9fa;
        }

        .toggle-password {
            cursor: pointer;
        }

        .btn-primary:hover {
            background-color: #3660c1;
            border-color: #3660c1;
        }
    </style>
</head>

<body class="auth-bg w-100">

    <div class="container auth-container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-10 col-md-8 col-lg-6">
                <div class="card shadow-lg auth-card p-4">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <h2 class="text-primary mb-2">
                                <i class="bi bi-newspaper"></i> Student News
                            </h2>
                            <p class="text-muted">Login to your account</p>
                        </div>

                        <form id="login-form">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" placeholder="you@example.com"
                                        required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="password" placeholder="********"
                                        required>
                                    <span class="input-group-text toggle-password" id="togglePassword">
                                        <i class="bi bi-eye-fill"></i>
                                    </span>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 mb-3">
                                <i class="bi bi-box-arrow-in-right me-2"></i> Login
                            </button>
                        </form>

                        <div class="text-center">
                            <p class="text-muted mb-0">Don't have an account?
                                <a href="/register" class="text-primary fw-semibold">Register here</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        // Fade-in effect
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelector('.auth-card').classList.add('show');
        });

        // Toggle password visibility
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePassword.innerHTML = type === 'password' ? '<i class="bi bi-eye-fill"></i>' : '<i class="bi bi-eye-slash-fill"></i>';
        });

        // Login form
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    sessionStorage.setItem('token', data.access_token);

                    const role = data.user.role;
                    window.location.href = role === 'admin' ? '/admin' : '/student';
                } else {
                    Swal.fire('Error', data.error || 'Login failed', 'error');
                }
            } catch (error) {
                Swal.fire('Error', 'An unexpected error occurred', 'error');
            }
        });
    </script>
</body>

</html>
