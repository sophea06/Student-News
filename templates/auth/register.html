<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Student News System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="icon" href="/static/images/logo.png" type="image/png">

    <style>
        body.auth-bg {
            background: linear-gradient(to right, #4e73df, #1cc88a);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .auth-card {
            max-width: 500px;
            margin: auto;
            border-radius: 15px;
            padding: 2rem;
            background: #ffffff;
            animation: fadeIn 1s ease;
        }

        .auth-logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 1rem;
            animation: bounce 1s infinite alternate;
        }

        .form-control-lg {
            padding: 0.75rem 0.75rem;
            font-size: 1.05rem;
        }

        .btn-lg {
            font-size: 1.1rem;
            padding: 0.75rem;
        }

        .password-strength {
            height: 6px;
            width: 0%;
            border-radius: 4px;
            margin-top: 5px;
            transition: width 0.3s ease;
        }

        .toggle-password {
            cursor: pointer;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-10px);
            }
        }
    </style>
</head>

<body class="auth-bg">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-lg auth-card text-center">
                    <!-- Logo -->
                    <img src="/static/images/logoPage.png" alt="Logo" class="auth-logo mx-auto d-block">
                    <div class="card-body">
                        <h2 class="text-primary mb-2">Student News</h2>
                        <p class="text-muted mb-4">Create your account</p>

                        <form id="register-form" class="text-start">
                            <div class="mb-3">
                                <label for="name" class="form-label">Full Name</label>
                                <input type="text" class="form-control form-control-lg" id="name"
                                    placeholder="Enter your full name" required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control form-control-lg" id="email"
                                    placeholder="Enter your email" required>
                            </div>

                            <div class="mb-3 position-relative">
                                <label for="password" class="form-label">Password</label>
                                <div class="input-group input-group-lg">
                                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                    <input type="password" class="form-control" id="password" placeholder="********"
                                        required>
                                    <span class="input-group-text toggle-password" id="togglePassword">
                                        <i class="bi bi-eye-fill"></i>
                                    </span>
                                </div>
                                <div class="password-strength bg-danger" id="passwordStrength"></div>
                                <small id="passwordStrengthText" class="text-muted"></small>
                            </div>

                            <div class="mb-3">
                                <label for="confirm-password" class="form-label">Confirm Password</label>
                                <input type="password" class="form-control form-control-lg" id="confirm-password"
                                    placeholder="Re-enter your password" required>
                            </div>

                            <div class="mb-3">
                                <label for="role" class="form-label">Account Type</label>
                                <select class="form-control form-control-lg" id="role" required>
                                    <option value="">Select Account Type</option>
                                    <option value="admin">Admin</option>
                                    <option value="student">Student</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">Register</button>
                        </form>

                        <p class="text-muted">Already have an account?
                            <a href="/login" class="text-primary">Login here</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        const passwordInput = document.getElementById('password');
        const strengthBar = document.getElementById('passwordStrength');
        const strengthText = document.getElementById('passwordStrengthText');
        const togglePassword = document.getElementById('togglePassword');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePassword.innerHTML = type === 'password'
                ? '<i class="bi bi-eye-fill"></i>'
                : '<i class="bi bi-eye-slash-fill"></i>';
        });

        passwordInput.addEventListener('input', () => {
            const val = passwordInput.value;
            let strength = 0;
            if (val.length >= 8) strength++;
            if (/[A-Z]/.test(val)) strength++;
            if (/[0-9]/.test(val)) strength++;
            if (/[\W]/.test(val)) strength++;

            switch (strength) {
                case 0:
                case 1:
                    strengthBar.style.width = '25%';
                    strengthBar.className = 'password-strength bg-danger';
                    strengthText.textContent = 'Weak';
                    strengthText.style.color = 'red';
                    break;
                case 2:
                    strengthBar.style.width = '50%';
                    strengthBar.className = 'password-strength bg-warning';
                    strengthText.textContent = 'Medium';
                    strengthText.style.color = '#e6a200';
                    break;
                case 3:
                    strengthBar.style.width = '75%';
                    strengthBar.className = 'password-strength bg-info';
                    strengthText.textContent = 'Strong';
                    strengthText.style.color = '#0dcaf0';
                    break;
                case 4:
                    strengthBar.style.width = '100%';
                    strengthBar.className = 'password-strength bg-success';
                    strengthText.textContent = 'Very Strong';
                    strengthText.style.color = 'green';
                    break;
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const role = document.getElementById('role').value;

            if (password !== confirmPassword) {
                Swal.fire('Error', 'Passwords do not match', 'error');
                return;
            }

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ name, email, password, role })
                });

                const data = await response.json();
                if (response.ok) {
                    Swal.fire('Success', 'Registration successful! Please login.', 'success')
                        .then(() => window.location.href = '/login');
                } else {
                    Swal.fire('Error', data.error || 'Registration failed', 'error');
                }
            } catch (error) {
                Swal.fire('Error', 'An error occurred', 'error');
            }
        });
    </script>
</body>

</html>
