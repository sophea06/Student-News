<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Student News System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="icon" href="/static/images/logo.png" type="image/png">

    <style>
        .auth-card {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.5s ease-in-out;
        }

        .auth-card.show {
            opacity: 1;
            transform: translateY(0);
        }

        .auth-bg {
            margin: 50px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            background: linear-gradient(to right, #4e73df, #1cc88a);
        }

        .input-group-text {
            background-color: #f8f9fa;
        }

        .toggle-password {
            cursor: pointer;
        }

        .password-strength {
            height: 5px;
            border-radius: 5px;
            margin-top: 2px;
        }

        .match-feedback {
            font-size: 0.9rem;
            margin-top: 2px;
        }

        .btn-primary:hover {
            background-color: #3660c1;
            border-color: #3660c1;
        }
    </style>
</head>

<body class="auth-bg">

    <div class="container auth-container">
        <div class="row justify-content-center align-items-center min-vh-100 w-50">
            <div class="col-10 col-md-8 col-lg-6">
                <div class="card shadow-lg auth-card p-4">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <h2 class="text-primary mb-2">
                                <i class="bi bi-newspaper"></i> Student News
                            </h2>
                            <p class="text-muted">Create your account</p>
                        </div>

                        <form id="register-form">
                            <div class="mb-3">
                                <label for="name" class="form-label">Full Name</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                                    <input type="text" class="form-control" id="name" placeholder="John Doe" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                                    <input type="email" class="form-control" id="email" placeholder="you@example.com"
                                        required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                    <input type="password" class="form-control" id="password" placeholder="********"
                                        required>
                                    <span class="input-group-text toggle-password" id="togglePassword1">
                                        <i class="bi bi-eye-fill"></i>
                                    </span>
                                </div>
                                <div class="password-strength bg-danger" id="passwordStrength"></div>
                            </div>

                            <div class="mb-3">
                                <label for="confirm-password" class="form-label">Confirm Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                    <input type="password" class="form-control" id="confirm-password"
                                        placeholder="********" required>
                                    <span class="input-group-text toggle-password" id="togglePassword2">
                                        <i class="bi bi-eye-fill"></i>
                                    </span>
                                </div>
                                <div class="match-feedback" id="matchFeedback"></div>
                            </div>

                            <div class="mb-3">
                                <label for="role" class="form-label">Account Type</label>
                                <select class="form-control" id="role" required>
                                    <option value="">Select Account Type</option>
                                    <option value="admin">Admin</option>
                                    <option value="student">Student</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 mb-3">
                                <i class="bi bi-person-plus-fill me-2"></i> Register
                            </button>
                        </form>

                        <div class="text-center">
                            <p class="text-muted mb-0">Already have an account?
                                <a href="/login" class="text-primary fw-semibold">Login here</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelector('.auth-card').classList.add('show');
        });

        // Toggle password visibility
        function togglePassword(toggleId, inputId) {
            const toggle = document.getElementById(toggleId);
            const input = document.getElementById(inputId);
            toggle.addEventListener('click', () => {
                const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                input.setAttribute('type', type);
                toggle.innerHTML = type === 'password' ? '<i class="bi bi-eye-fill"></i>' : '<i class="bi bi-eye-slash-fill"></i>';
            });
        }
        togglePassword('togglePassword1', 'password');
        togglePassword('togglePassword2', 'confirm-password');

        // Password strength checker
        const passwordInput = document.getElementById('password');
        const strengthBar = document.getElementById('passwordStrength');

        passwordInput.addEventListener('input', () => {
            const val = passwordInput.value;
            let strength = 0;
            if (val.length >= 8) strength++;
            if (/[A-Z]/.test(val)) strength++;
            if (/[0-9]/.test(val)) strength++;
            if (/[\W]/.test(val)) strength++;

            // Strength bar
            switch (strength) {
                case 0:
                case 1:
                    strengthBar.style.width = '25%';
                    strengthBar.className = 'password-strength bg-danger';
                    break;
                case 2:
                    strengthBar.style.width = '50%';
                    strengthBar.className = 'password-strength bg-warning';
                    break;
                case 3:
                    strengthBar.style.width = '75%';
                    strengthBar.className = 'password-strength bg-info';
                    break;
                case 4:
                    strengthBar.style.width = '100%';
                    strengthBar.className = 'password-strength bg-success';
                    break;
            }
        });

        // Confirm password match check
        const confirmInput = document.getElementById('confirm-password');
        const matchFeedback = document.getElementById('matchFeedback');

        function checkMatch() {
            if (!confirmInput.value) {
                matchFeedback.textContent = '';
                return;
            }
            if (passwordInput.value === confirmInput.value) {
                matchFeedback.textContent = 'Passwords match ✅';
                matchFeedback.style.color = 'green';
            } else {
                matchFeedback.textContent = 'Passwords do not match ❌';
                matchFeedback.style.color = 'red';
            }
        }

        passwordInput.addEventListener('input', checkMatch);
        confirmInput.addEventListener('input', checkMatch);

        // Registration form submission
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const confirmPassword = document.getElementById('confirm-password').value.trim();
            const role = document.getElementById('role').value;

            if (password !== confirmPassword) {
                Swal.fire('Error', 'Passwords do not match', 'error');
                return;
            }

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ name, email, password, role })
                });

                const data = await response.json();

                if (response.ok) {
                    Swal.fire('Success', 'Registration successful! Please login.', 'success')
                        .then(() => window.location.href = '/login');
                } else {
                    Swal.fire('Error', data.error || 'Registration failed', 'error');
                }
            } catch (error) {
                Swal.fire('Error', 'An unexpected error occurred', 'error');
            }
        });
    </script>
</body>

</html>
