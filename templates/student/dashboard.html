{% extends "base.html" %}

{% block title %}Student Dashboard - Student News System{% endblock %}

{% block extra_css %}
<style>
    .post-card {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        cursor: pointer;
        border-left: 4px solid #0d6efd;
    }
    .post-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }
    .category-badge {
        font-size: 0.8rem;
        padding: 5px 10px;
        border-radius: 20px;
    }
    .search-bar {
        margin-bottom: 20px;
    }
    .filter-sidebar {
        background-color: #f8f9fa;
        padding: 20px;
        border-radius: 10px;
        height: fit-content;
    }
    .notification-badge {
        position: absolute;
        top: -8px;
        right: -8px;
        background-color: #dc3545;
        color: white;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.7rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="row">
    <!-- Sidebar -->
    <div class="col-md-3">
        <div class="filter-sidebar">
            <h5 class="mb-3">
                <i class="bi bi-bell"></i> Notifications
                <span id="notification-count" class="badge bg-danger" style="display: none;">0</span>
            </h5>
            <div id="notifications-container" style="max-height: 300px; overflow-y: auto; margin-bottom: 20px;">
                <small class="text-muted">No new notifications</small>
            </div>

            <hr>

            <h5 class="mb-3">Categories</h5>
            <div class="btn-group-vertical w-100">
                <button class="btn btn-outline-primary text-start active" onclick="filterCategory('all')">
                    All Posts
                </button>
                <button class="btn btn-outline-primary text-start" onclick="filterCategory('campus')">
                    Campus News
                </button>
                <button class="btn btn-outline-primary text-start" onclick="filterCategory('events')">
                    Events
                </button>
                <button class="btn btn-outline-primary text-start" onclick="filterCategory('announcements')">
                    Announcements
                </button>
            </div>

            <hr>

            <button class="btn btn-outline-danger w-100" onclick="logout()">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="col-md-9">
        <!-- Search Bar -->
        <div class="search-bar">
            <input type="text" class="form-control" id="search-input" placeholder="Search posts...">
        </div>

        <!-- Posts List -->
        <div id="posts-container">
            <div class="text-center mt-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Post Detail Modal -->
<div class="modal fade" id="postDetailModal" tabindex="-1" aria-labelledby="postDetailModalLabel">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="postDetailModalLabel"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="post-detail-image" style="display: none;">
                    <img id="post-detail-image-src" class="img-fluid mb-3" alt="Post image">
                </div>
                <p id="post-detail-content"></p>
                <small class="text-muted">
                    By <strong id="post-detail-author"></strong> on <span id="post-detail-date"></span>
                </small>
                <hr>

                <!-- Like and Share Buttons -->
                <div class="mb-3">
                    <button class="btn btn-outline-primary btn-sm" id="like-btn" onclick="toggleLike()">
                        <i class="bi bi-heart"></i> Like (<span id="like-count">0</span>)
                    </button>
                    <button class="btn btn-outline-secondary btn-sm" onclick="sharePost()">
                        <i class="bi bi-share"></i> Share
                    </button>
                </div>

                <!-- Comments Section -->
                <h6>Comments (<span id="comment-count">0</span>)</h6>
                <div id="comments-container" style="max-height: 300px; overflow-y: auto; margin-bottom: 15px;">
                </div>

                <form id="comment-form">
                    <div class="input-group">
                        <input type="text" class="form-control" id="comment-input" placeholder="Add a comment...">
                        <button class="btn btn-primary" type="submit">Post</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
    const token = localStorage.getItem("token");
    let currentPostId = null;
    let currentCategory = 'all';

    // Check if token exists and redirect if not
    if (!token) {
        window.location.href = "/login";
    }

    async function loadPosts(category = 'all', search = '') {
        try {
            let url = '/api/posts?category=' + (category === 'all' ? 'all' : category);
            if (search) url += '&search=' + search;

            const response = await fetch(url, {
                headers: { Authorization: `Bearer ${token}` },
            });
            if (response.status === 401) {
                window.location.href = "/login";
                return;
            }
            const data = await response.json();
            const posts = data.posts || [];

            let html = '';
            if (posts.length === 0) {
                html = '<p class="text-center text-muted mt-5">No posts found.</p>';
            } else {
                posts.forEach(post => {
                    const badge = `<span class="badge bg-info category-badge">${post.category}</span>`;
                    html += `
                        <div class="card post-card mb-3" onclick="showPostDetail(${post.id})">
                            <div class="card-body">
                                ${post.image_url ? `<img src="${post.image_url}" class="card-img-top mb-3" style="max-height: 200px; object-fit: cover;" alt="Post image">` : ''}
                                <div class="d-flex justify-content-between align-items-start">
                                    <div style="flex: 1;">
                                        <h5 class="card-title">${post.title}</h5>
                                        <p class="card-text text-muted">${post.content.substring(0, 150)}...</p>
                                        <div class="d-flex gap-2 align-items-center">
                                            ${badge}
                                            <small class="text-muted">${post.created_at}</small>
                                        </div>
                                    </div>
                                </div>
                                <div class="mt-2">
                                    <small class="text-muted me-3">
                                        <i class="bi bi-heart"></i> ${post.likes_count}
                                    </small>
                                    <small class="text-muted me-3">
                                        <i class="bi bi-chat"></i> ${post.comments_count}
                                    </small>
                                    <small class="text-muted">
                                        <i class="bi bi-eye"></i> ${post.view_count} views
                                    </small>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }

            document.getElementById('posts-container').innerHTML = html;
        } catch (error) {
            console.error('Error loading posts:', error);
        }
    }

    async function showPostDetail(postId) {
        currentPostId = postId;
        try {
            const response = await fetch(`/api/posts/${postId}`, {
                headers: { Authorization: `Bearer ${token}` },
            });
            if (response.status === 401) {
                window.location.href = "/login";
                return;
            }
            const post = await response.json();

            document.getElementById('postDetailModalLabel').textContent = post.title;
            document.getElementById('post-detail-content').textContent = post.content;
            document.getElementById('post-detail-author').textContent = post.author;
            document.getElementById('post-detail-date').textContent = post.created_at;
            document.getElementById('like-count').textContent = post.likes_count;
            document.getElementById('comment-count').textContent = post.comments.length;

            // Handle image display
            const imageContainer = document.getElementById('post-detail-image');
            const imageElement = document.getElementById('post-detail-image-src');
            if (post.image_url) {
                imageElement.src = post.image_url;
                imageContainer.style.display = 'block';
            } else {
                imageContainer.style.display = 'none';
            }

            let commentsHtml = '';
            post.comments.forEach(comment => {
                commentsHtml += `
                    <div class="card mb-2">
                        <div class="card-body p-2">
                            <p class="mb-1"><strong>${comment.author}</strong></p>
                            <p class="mb-1">${comment.content}</p>
                            <small class="text-muted">${comment.created_at}</small>
                        </div>
                    </div>
                `;
            });

            document.getElementById('comments-container').innerHTML = commentsHtml || '<small class="text-muted">No comments yet.</small>';

            const modalElement = document.getElementById('postDetailModal');
            const modal = new bootstrap.Modal(modalElement);

            // Store the currently focused element to restore focus later
            const previouslyFocusedElement = document.activeElement;

            modal.show();

            // Restore focus when modal is hidden
            modalElement.addEventListener('hidden.bs.modal', function() {
                if (previouslyFocusedElement && previouslyFocusedElement.focus) {
                    previouslyFocusedElement.focus();
                }
            }, { once: true });
        } catch (error) {
            console.error('Error loading post detail:', error);
        }
    }

    async function toggleLike() {
        try {
            // First check current like status
            const postResponse = await fetch(`/api/posts/${currentPostId}`, {
                headers: { Authorization: `Bearer ${token}` },
            });
            if (postResponse.status === 401) {
                window.location.href = "/login";
                return;
            }
            if (!postResponse.ok) {
                Swal.fire('Error', 'Failed to load post details', 'error');
                return;
            }
            const postData = await postResponse.json();
            const isCurrentlyLiked = postData.is_liked;

            // Toggle based on current state
            const url = isCurrentlyLiked ? `/api/posts/${currentPostId}/unlike` : `/api/posts/${currentPostId}/like`;
            const response = await fetch(url, {
                method: 'POST',
                headers: { Authorization: `Bearer ${token}` },
            });

            if (response.ok) {
                showPostDetail(currentPostId);
            } else {
                Swal.fire('Error', 'Failed to toggle like', 'error');
            }
        } catch (error) {
            Swal.fire('Error', 'Failed to toggle like', 'error');
        }
    }

    document.getElementById('comment-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const commentText = document.getElementById('comment-input').value;

        try {
            const response = await fetch(`/api/posts/${currentPostId}/comments`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    Authorization: `Bearer ${token}`
                },
                body: JSON.stringify({ content: commentText })
            });
            if (response.status === 401) {
                window.location.href = "/login";
                return;
            }

            if (response.ok) {
                document.getElementById('comment-input').value = '';
                showPostDetail(currentPostId);
            }
        } catch (error) {
            Swal.fire('Error', 'Failed to add comment', 'error');
        }
    });

    function sharePost() {
        const postUrl = `${window.location.origin}/post/${currentPostId}`;
        const text = `Check out this post on Student News: ${document.getElementById('post-detail-title').textContent}`;

        if (navigator.share) {
            navigator.share({
                title: 'Student News',
                text: text,
                url: postUrl
            });
        } else {
            navigator.clipboard.writeText(postUrl);
            Swal.fire('Success', 'Post link copied to clipboard!', 'success');
        }
    }

    function filterCategory(category) {
        currentCategory = category;
        loadPosts(category);

        document.querySelectorAll('.filter-sidebar .btn').forEach(btn => {
            btn.classList.remove('active');
        });
        event.target.classList.add('active');
    }

    document.getElementById('search-input').addEventListener('keyup', (e) => {
        const search = e.target.value;
        loadPosts(currentCategory, search);
    });

    async function loadNotifications() {
        try {
            const response = await fetch('/api/users/notifications', {
                headers: { Authorization: `Bearer ${token}` },
            });
            if (response.status === 401) {
                window.location.href = "/login";
                return;
            }
            const data = response.ok ? await response.json() : { notifications: [] };
            const notifications = data.notifications || [];

            let unreadCount = 0;
            let html = '';

            notifications.slice(0, 5).forEach(notif => {
                if (notif.status === 'unread') unreadCount++;
                html += `
                    <div class="alert alert-info alert-sm p-2 mb-2">
                        <small>${notif.message}</small>
                    </div>
                `;
            });

            document.getElementById('notifications-container').innerHTML = html || '<small class="text-muted">No notifications</small>';

            if (unreadCount > 0) {
                document.getElementById('notification-count').textContent = unreadCount;
                document.getElementById('notification-count').style.display = 'inline-block';
            }
        } catch (error) {
            console.error('Error loading notifications:', error);
        }
    }

    loadPosts();
    loadNotifications();

    setInterval(loadNotifications, 10000);

    async function logout() {
        try {
            const response = await fetch('/api/auth/logout', {
                method: 'POST',
                headers: { Authorization: `Bearer ${token}` },
                credentials: 'include'
            });
        } catch (error) {
            console.error('Logout error:', error);
        }

        // Clear session and redirect
        sessionStorage.clear();
        localStorage.clear();
        window.location.href = '/logout';
    }
</script>
{% endblock %}
