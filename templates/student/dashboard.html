{% extends "base.html" %}

{% block title %}Student Dashboard - Student News System{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/student-style.css') }}">
{% endblock %}

{% block content %}
<div class="row">
    <!-- Sidebar -->
    <div class="col-md-3">
        <div class="filter-sidebar">
            <h5 class="mb-3">
                <i class="bi bi-bell"></i> Notifications
                <span id="notification-count" class="badge bg-danger" style="display: none;">0</span>
            </h5>
            <div id="notifications-container" class="notifications-container">
                <small class="text-muted">No new notifications</small>
            </div>

            <hr>


            <hr>

            <button class="btn btn-outline-danger w-100" id="logoutBtn">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="col-md-9">
        <!-- Search and Filter Bar -->
        <div class="search-filter-bar">
            <div class="d-flex justify-content-between align-items-center flex-wrap">
                <h4 class="mb-0">Latest News</h4>
                <div class="d-flex gap-2 flex-wrap">
                    <select id="categoryFilter" class="form-select form-select-sm" style="width: auto;" aria-label="Filter by category">
                        <option value="all">All Categories</option>
                        <option value="announcement">Announcements</option>
                        <option value="news">News</option>
                        <option value="event">Events</option>
                        <option value="academic">Academic</option>
                    </select>
                    <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Search posts..." aria-label="Search posts">
                    <button class="btn btn-primary btn-sm" onclick="loadPosts()" aria-label="Search">
                        <i class="bi bi-search"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Posts Container -->
        <div id="postsContainer">
            <!-- Posts will be loaded here -->
        </div>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="loading-spinner" style="display: none;">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <!-- Pagination -->
        <nav id="paginationNav" class="mt-4" style="display: none;">
            <ul class="pagination justify-content-center" id="paginationList">
            </ul>
        </nav>
    </div>
</div>

<!-- Post Detail Modal -->
<div class="modal fade" id="postDetailModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="postDetailModalLabel"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="post-detail-image" style="display: none;">
                    <img id="post-detail-image-src" class="img-fluid mb-3" alt="Post image">
                </div>
                <p id="post-detail-content"></p>
                <small class="text-muted">
                    By <strong id="post-detail-author"></strong> on <span id="post-detail-date"></span>
                </small>
                <hr>

                <!-- Like and Share Buttons -->
                <div class="mb-3">
                    <button class="btn btn-outline-primary btn-sm" id="like-btn" onclick="toggleLike()">
                        <i class="bi bi-heart"></i> Like (<span id="like-count">0</span>)
                    </button>
                    <button class="btn btn-outline-secondary btn-sm" onclick="sharePost()">
                        <i class="bi bi-share"></i> Share
                    </button>
                </div>

                <!-- Comments Section -->
                <h6>Comments (<span id="comment-count">0</span>)</h6>
                <div id="comments-container" class="comments-container">
                </div>

                <form id="comment-form">
                    <div class="input-group">
                        <input type="text" class="form-control" id="comment-input" placeholder="Add a comment...">
                        <button class="btn btn-primary" type="submit">Post</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
    const token = localStorage.getItem("token");
    let currentPostId = null;

    // Check if token exists and redirect if not
    if (!token) {
        window.location.href = "/login";
    }

    // Load posts on page load
    loadPosts();

    // Add event listener for logout button
    document.getElementById('logoutBtn').addEventListener('click', logout);


    async function showPostDetail(postId) {
        currentPostId = postId;
        try {
            const response = await fetch(`/api/posts/${postId}`, {
                headers: { Authorization: `Bearer ${token}` },
            });
            if (response.status === 401) {
                window.location.href = "/login";
                return;
            }
            const post = await response.json();

            document.getElementById('postDetailModalLabel').textContent = post.title;
            document.getElementById('post-detail-content').textContent = post.content;
            document.getElementById('post-detail-author').textContent = post.author;
            document.getElementById('post-detail-date').textContent = post.created_at;
            document.getElementById('like-count').textContent = post.likes_count;
            document.getElementById('comment-count').textContent = post.comments.length;

            // Handle image display
            const imageContainer = document.getElementById('post-detail-image');
            const imageElement = document.getElementById('post-detail-image-src');
            if (post.image_url) {
                imageElement.src = post.image_url;
                imageContainer.style.display = 'block';
            } else {
                imageContainer.style.display = 'none';
            }

            let commentsHtml = '';
            post.comments.forEach(comment => {
                commentsHtml += `
                    <div class="card mb-2">
                        <div class="card-body p-2">
                            <p class="mb-1"><strong>${comment.author}</strong></p>
                            <p class="mb-1">${comment.content}</p>
                            <small class="text-muted">${comment.created_at}</small>
                        </div>
                    </div>
                `;
            });

            document.getElementById('comments-container').innerHTML = commentsHtml || '<small class="text-muted">No comments yet.</small>';

            const modalElement = document.getElementById('postDetailModal');
            const modal = new bootstrap.Modal(modalElement);

            // Store the currently focused element to restore focus later
            const previouslyFocusedElement = document.activeElement;

            modal.show();

            // Restore focus when modal is hidden
            modalElement.addEventListener('hidden.bs.modal', function() {
                if (previouslyFocusedElement && previouslyFocusedElement.focus) {
                    previouslyFocusedElement.focus();
                }
            }, { once: true });
        } catch (error) {
            console.error('Error loading post detail:', error);
        }
    }

    async function toggleLike() {
        try {
            // First check current like status
            const postResponse = await fetch(`/api/posts/${currentPostId}`, {
                headers: { Authorization: `Bearer ${token}` },
            });
            if (postResponse.status === 401) {
                window.location.href = "/login";
                return;
            }
            if (!postResponse.ok) {
                Swal.fire('Error', 'Failed to load post details', 'error');
                return;
            }
            const postData = await postResponse.json();
            const isCurrentlyLiked = postData.is_liked;

            // Toggle based on current state
            const url = isCurrentlyLiked ? `/api/posts/${currentPostId}/unlike` : `/api/posts/${currentPostId}/like`;
            const response = await fetch(url, {
                method: 'POST',
                headers: { Authorization: `Bearer ${token}` },
            });

            if (response.ok) {
                showPostDetail(currentPostId);
            } else {
                Swal.fire('Error', 'Failed to toggle like', 'error');
            }
        } catch (error) {
            Swal.fire('Error', 'Failed to toggle like', 'error');
        }
    }

    document.getElementById('comment-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const commentText = document.getElementById('comment-input').value;

        try {
            const response = await fetch(`/api/posts/${currentPostId}/comments`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    Authorization: `Bearer ${token}`
                },
                body: JSON.stringify({ content: commentText })
            });
            if (response.status === 401) {
                window.location.href = "/login";
                return;
            }

            if (response.ok) {
                document.getElementById('comment-input').value = '';
                showPostDetail(currentPostId);
            }
        } catch (error) {
            Swal.fire('Error', 'Failed to add comment', 'error');
        }
    });

    function sharePost() {
        const postUrl = `${window.location.origin}/post/${currentPostId}`;
        const titleElement = document.getElementById('postDetailModalLabel');
        const text = titleElement ? `Check out this post on Student News: ${titleElement.textContent}` : 'Check out this post on Student News';

        if (navigator.share) {
            navigator.share({
                title: 'Student News',
                text: text,
                url: postUrl
            });
        } else {
            navigator.clipboard.writeText(postUrl);
            Swal.fire('Success', 'Post link copied to clipboard!', 'success');
        }
    }


    async function loadNotifications() {
        try {
            const response = await fetch('/api/users/notifications', {
                headers: { Authorization: `Bearer ${token}` },
            });
            if (response.status === 401) {
                localStorage.clear();
                window.location.href = "/login";
                return;
            }
            if (!response.ok) {
                console.error('Failed to load notifications:', response.status);
                return;
            }
            const data = await response.json();
            const notifications = data.notifications || [];

            let unreadCount = 0;
            let html = '';

            notifications.slice(0, 5).forEach(notif => {
                if (notif.status === 'unread') unreadCount++;
                html += `
                    <div class="alert alert-info alert-sm p-2 mb-2">
                        <small>${notif.message}</small>
                    </div>
                `;
            });

            document.getElementById('notifications-container').innerHTML = html || '<small class="text-muted">No notifications</small>';

            if (unreadCount > 0) {
                document.getElementById('notification-count').textContent = unreadCount;
                document.getElementById('notification-count').style.display = 'inline-block';
            } else {
                document.getElementById('notification-count').style.display = 'none';
            }
        } catch (error) {
            console.error('Error loading notifications:', error);
        }
    }

    loadNotifications();

    setInterval(loadNotifications, 10000);

    // Add event listeners for search and filter
    document.getElementById('searchInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            loadPosts();
        }
    });

    document.getElementById('categoryFilter').addEventListener('change', function() {
        loadPosts();
    });

    async function loadPosts(page = 1) {
        const postsContainer = document.getElementById('postsContainer');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const paginationNav = document.getElementById('paginationNav');
        const paginationList = document.getElementById('paginationList');

        // Show loading spinner
        loadingSpinner.style.display = 'block';
        postsContainer.innerHTML = '';

        try {
            const category = document.getElementById('categoryFilter').value;
            const search = document.getElementById('searchInput').value.trim();

            let url = `/api/posts?page=${page}&per_page=10`;
            if (category && category !== 'all') {
                url += `&category=${category}`;
            }
            if (search) {
                url += `&search=${encodeURIComponent(search)}`;
            }

            const response = await fetch(url, {
                headers: { Authorization: `Bearer ${token}` },
            });

            if (response.status === 401) {
                window.location.href = "/login";
                return;
            }

            if (!response.ok) {
                throw new Error('Failed to load posts');
            }

            const data = await response.json();
            const posts = data.posts || [];

            // Hide loading spinner
            loadingSpinner.style.display = 'none';

            if (posts.length === 0) {
                postsContainer.innerHTML = `
                    <div class="text-center py-5">
                        <i class="bi bi-newspaper" style="font-size: 3rem; color: #6c757d;"></i>
                        <h4 class="mt-3 text-muted">No posts found</h4>
                        <p class="text-muted">Try adjusting your search or filter criteria.</p>
                    </div>`;
                paginationNav.style.display = 'none';
                return;
            }

            // Render posts
            postsContainer.innerHTML = posts.map(post => `
                <div class="card post-card mb-3" onclick="showPostDetail(${post.id})">
                    ${post.image_url ? `<img src="${post.image_url}" class="card-img-top" alt="Post image">` : ''}
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <span class="badge bg-primary category-badge">${post.category}</span>
                            ${post.is_pinned ? '<i class="bi bi-pin-angle-fill text-warning" title="Pinned"></i>' : ''}
                        </div>
                        <h5 class="card-title">${post.title}</h5>
                        <p class="card-text">${post.content}</p>
                        <div class="d-flex justify-content-between align-items-center text-muted small">
                            <span><i class="bi bi-person"></i> ${post.author}</span>
                            <span><i class="bi bi-calendar"></i> ${new Date(post.created_at).toLocaleDateString()}</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <div>
                                <button class="btn btn-outline-primary btn-sm me-2" onclick="event.stopPropagation(); toggleLike(${post.id})">
                                    <i class="bi ${post.is_liked ? 'bi-heart-fill' : 'bi-heart'}"></i> ${post.likes_count}
                                </button>
                                <button class="btn btn-outline-secondary btn-sm me-2" onclick="event.stopPropagation(); sharePost(${post.id})">
                                    <i class="bi bi-share"></i> Share
                                </button>
                            </div>
                            <div class="text-muted small">
                                <i class="bi bi-eye"></i> ${post.view_count} views
                                <i class="bi bi-chat me-1 ms-2"></i> ${post.comments_count}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            // Render pagination
            const totalPages = data.pages || 1;
            if (totalPages > 1) {
                paginationNav.style.display = 'block';
                paginationList.innerHTML = '';

                // Previous button
                const prevDisabled = page <= 1 ? 'disabled' : '';
                paginationList.innerHTML += `
                    <li class="page-item ${prevDisabled}">
                        <a class="page-link" href="#" onclick="event.preventDefault(); loadPosts(${page - 1})" aria-label="Previous">
                            <span aria-hidden="true">&laquo;</span>
                        </a>
                    </li>`;

                // Page numbers
                for (let i = Math.max(1, page - 2); i <= Math.min(totalPages, page + 2); i++) {
                    const active = i === page ? 'active' : '';
                    paginationList.innerHTML += `
                        <li class="page-item ${active}">
                            <a class="page-link" href="#" onclick="event.preventDefault(); loadPosts(${i})">${i}</a>
                        </li>`;
                }

                // Next button
                const nextDisabled = page >= totalPages ? 'disabled' : '';
                paginationList.innerHTML += `
                    <li class="page-item ${nextDisabled}">
                        <a class="page-link" href="#" onclick="event.preventDefault(); loadPosts(${page + 1})" aria-label="Next">
                            <span aria-hidden="true">&raquo;</span>
                        </a>
                    </li>`;
            } else {
                paginationNav.style.display = 'none';
            }

        } catch (error) {
            console.error('Error loading posts:', error);
            loadingSpinner.style.display = 'none';
            postsContainer.innerHTML = `
                <div class="text-center py-5">
                    <i class="bi bi-exclamation-triangle" style="font-size: 3rem; color: #dc3545;"></i>
                    <h4 class="mt-3 text-danger">Unable to load posts</h4>
                    <p class="text-muted">Please try refreshing the page.</p>
                </div>`;
            paginationNav.style.display = 'none';
        }
    }

    function sharePost(postId) {
        const postUrl = `${window.location.origin}/post/${postId}`;
        if (navigator.share) {
            navigator.share({
                title: 'Student News',
                text: 'Check out this post on Student News',
                url: postUrl
            });
        } else {
            navigator.clipboard.writeText(postUrl).then(() => {
                // Show success message
                const toast = document.createElement('div');
                toast.className = 'toast align-items-center text-white bg-success border-0';
                toast.setAttribute('role', 'alert');
                toast.innerHTML = `
                    <div class="d-flex">
                        <div class="toast-body">Post link copied to clipboard!</div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                    </div>`;
                document.body.appendChild(toast);
                const bsToast = new bootstrap.Toast(toast);
                bsToast.show();
                setTimeout(() => document.body.removeChild(toast), 3000);
            });
        }
    }

    async function logout() {
        try {
            const response = await fetch('/api/auth/logout', {
                method: 'POST',
                headers: { Authorization: `Bearer ${token}` },
                credentials: 'include'
            });
        } catch (error) {
            console.error('Logout error:', error);
        }

        // Clear session and redirect
        sessionStorage.clear();
        localStorage.clear();
        window.location.href = '/logout';
    }
</script>
{% endblock %}
