<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard - Student News</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/chart.js@3.7.0/dist/chart.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .stat-card h6 {
            opacity: 0.9;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .stat-card h3 {
            font-weight: bold;
            margin: 0;
        }
        .stat-card.orange {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .stat-card.green {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        .stat-card.blue {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }
        .chart-container {
            position: relative;
            height: 300px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Student News</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/admin">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/admin/analytics">Analytics</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="logout()">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-4">
        <h1 class="mb-4">Analytics Dashboard</h1>

        <!-- Key Metrics -->
        <div class="row">
            <div class="col-md-3">
                <div class="stat-card">
                    <h6>Total Users</h6>
                    <h3 id="totalUsers">0</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card orange">
                    <h6>Total Posts</h6>
                    <h3 id="totalPosts">0</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card green">
                    <h6>Total Likes</h6>
                    <h3 id="totalLikes">0</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card blue">
                    <h6>Total Comments</h6>
                    <h3 id="totalComments">0</h3>
                </div>
            </div>
        </div>

        <!-- Additional Metrics -->
        <div class="row mt-4">
            <div class="col-md-3">
                <div class="stat-card">
                    <h6>Total Views</h6>
                    <h3 id="totalViews">0</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card orange">
                    <h6>Posts This Month</h6>
                    <h3 id="postsThisMonth">0</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card green">
                    <h6>Active Students</h6>
                    <h3 id="activeStudents">0</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card blue">
                    <h6>Most Active</h6>
                    <h3 id="mostActive">-</h3>
                </div>
            </div>
        </div>

        <!-- Charts -->
        <div class="row mt-5">
            <div class="col-md-6">
                <h5>Trending Posts (Last 7 Days)</h5>
                <div class="chart-container">
                    <canvas id="trendingChart"></canvas>
                </div>
            </div>
            <div class="col-md-6">
                <h5>Most Popular Posts</h5>
                <div class="chart-container">
                    <canvas id="popularChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.0/dist/chart.min.js"></script>
    <script>
        const token = localStorage.getItem('token');
        let trendingChart, popularChart;

        async function loadAnalytics() {
            try {
                const response = await fetch('/api/analytics/dashboard', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                document.getElementById('totalUsers').textContent = data.total_users;
                document.getElementById('totalPosts').textContent = data.total_posts;
                document.getElementById('totalLikes').textContent = data.total_likes;
                document.getElementById('totalComments').textContent = data.total_comments;
                document.getElementById('totalViews').textContent = data.total_views;
                document.getElementById('postsThisMonth').textContent = data.posts_this_month;
                document.getElementById('activeStudents').textContent = data.active_students_this_month;
                document.getElementById('mostActive').textContent = data.most_active_user ? data.most_active_user.name : 'N/A';
            } catch (error) {
                console.error('Error loading analytics:', error);
            }
        }

        async function loadTrendingPosts() {
            try {
                const response = await fetch('/api/analytics/trending-posts', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                const ctx = document.getElementById('trendingChart').getContext('2d');
                if (trendingChart) trendingChart.destroy();

                const labels = data.trending_posts.slice(0, 5).map(p => p.title.substring(0, 20));
                const engagementData = data.trending_posts.slice(0, 5).map(p => p.engagement_score || (p.likes_count + p.comments_count));

                trendingChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Engagement Score',
                            data: engagementData,
                            backgroundColor: 'rgba(102, 126, 234, 0.7)',
                            borderColor: 'rgba(102, 126, 234, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: { y: { beginAtZero: true } }
                    }
                });
            } catch (error) {
                console.error('Error loading trending posts:', error);
            }
        }

        async function loadPopularPosts() {
            try {
                const response = await fetch('/api/analytics/popular-posts', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                const ctx = document.getElementById('popularChart').getContext('2d');
                if (popularChart) popularChart.destroy();

                const labels = data.popular_posts.slice(0, 5).map(p => p.title.substring(0, 20));
                const viewData = data.popular_posts.slice(0, 5).map(p => p.view_count);

                popularChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Views',
                            data: viewData,
                            borderColor: 'rgba(245, 87, 108, 1)',
                            backgroundColor: 'rgba(245, 87, 108, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: { y: { beginAtZero: true } }
                    }
                });
            } catch (error) {
                console.error('Error loading popular posts:', error);
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('userId');
            localStorage.removeItem('role');
            window.location.href = '/';
        }

        // Load data on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadAnalytics();
            loadTrendingPosts();
            loadPopularPosts();
        });
    </script>
</body>
</html>
